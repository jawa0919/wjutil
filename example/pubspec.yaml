name: wjutil_example
description: "Demonstrates how to use the wjutil plugin."
publish_to: "none"
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  material_ui: ">=1.0.0 <2.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  package_info_plus: ">=10.0.0 <11.0.0"
  device_info_plus: ">=13.0.0 <14.0.0"
  url_launcher: ">=6.0.0 <7.0.0"
  share_plus: ">=13.0.0 <14.0.0"
  connectivity_plus: ">=7.0.0 <8.0.0"
  dio: ">=5.0.0 <6.0.0"
  dio_log_plus: ">=4.0.0 <5.0.0"
  permission_handler: ">=12.0.0 <13.0.0"
  image_picker: ">=1.0.0 <2.0.0"
  saver_gallery: ">=5.0.0 <6.0.0"
  path: ">=1.0.0 <2.0.0"
  flutter_zxing: ">=2.0.0 <3.0.0"
  signals: ">=6.0.0 <7.0.0"
  flutter_smart_dialog: ">=5.0.0 <6.0.0"
  flutter_inappwebview: ^6.2.0-beta.3
  extended_image: ">=10.0.0 <11.0.0"
  wjutil:
    git:
      url: https://github.com/jawa0919/wjutil.git
  go_router: ">=18.0.0 <19.0.0"
  flutter_screenutil: ">=5.0.0 <6.0.0"
  flutter_keyboard_visibility: ">=7.0.0 <8.0.0"

dependency_overrides:
  wjutil:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
